<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}DuoCut Studio{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230e0e12'/%3E%3Cpath d='M9 8h6a8 8 0 0 1 0 16H9z' fill='%23ff3d6e'/%3E%3Cpath d='M17 8h0a8 8 0 0 1 0 16' stroke='%2322d3ee' stroke-width='3' fill='none'/%3E%3C/svg%3E">
</head>
<body>
<div class="shell">
  <aside class="rail">
    <a class="brand" href="/">
      <svg width="34" height="34" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#0e0e12" stroke="#292934"/><path d="M8 8h6.5a8 8 0 0 1 0 16H8z" fill="#ff3d6e"/><path d="M17.5 8.6a8 8 0 0 1 0 14.8" stroke="#22d3ee" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M11 14.2v3.6l3-1.8z" fill="#fff"/></svg>
      <span><b>DuoCut</b><small>STUDIO</small></span>
    </a>
    <nav class="nav">
      <a href="/" class="{{ 'on' if nav == 'home' }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M8 21h8M10 9l5 2.5-5 2.5z"/></svg><span class="lbl">Campaigns</span></a>
      <a href="/queue" class="{{ 'on' if nav == 'queue' }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg><span class="lbl">Clips to post</span>{% if waiting_count %}<span class="count">{{ waiting_count }}</span>{% endif %}</a>
      <a href="/insights" class="{{ 'on' if nav == 'insights' }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span class="lbl">What's working</span></a>
    </nav>
    <div class="rail-foot">
      <span><span class="dot {{ '' if claude_ok else 'off' }}"></span>{{ 'Claude Code connected' if claude_ok else 'Claude Code not found' }}</span>
      <span>Runs on this computer only. Nothing is ever posted for you.</span>
    </div>
  </aside>
  <main>
    {% block main %}{% endblock %}
  </main>
</div>
<div class="toast" id="toast"></div>
<script src="{{ url_for('static', filename='app.js') }}"></script>
{% block script %}{% endblock %}
</body>
</html>
