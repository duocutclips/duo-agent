[project]
name = "clipfactory"
version = "0.1.0"
description = "Roblox Clip Factory backend: campaign analysis, gameplay analysis, timeline building and deterministic FFmpeg rendering."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
  "anthropic>=1.0",
  "httpx>=0.27",
  "pypdf>=4.0",
  "python-docx>=1.1",
  "numpy>=1.26",
  "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout>=2.3", "ruff>=0.5", "mypy>=1.10"]
local-whisper = ["faster-whisper>=1.0"]

[project.scripts]
clipfactory = "clipfactory.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["clipfactory*"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["clipfactory", "conftest"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["../tests/backend"]
timeout = 600
markers = ["slow: renders video (seconds to tens of seconds)"]
