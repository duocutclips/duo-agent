[package]
name = "roblox-clip-factory"
version = "0.1.0"
description = "Roblox Clip Factory desktop shell"
edition = "2021"
rust-version = "1.77"

[lib]
name = "clip_factory_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
getrandom = "0.2"

[profile.release]
strip = true
lto = true
